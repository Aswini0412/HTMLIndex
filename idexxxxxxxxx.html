<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="business-card">

        <img
            class="profile-image"
            src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
            alt="Profile flower image"
        >

        <p class="full-name">Ashu</p>
        <p class="designation">Software Developer</p>
        <p class="company">Tech Solutions</p>

        <hr>

        <p>ashu@example.com</p>
        <p>+91 98765 43210</p>

        <a class="portfolio-link" href="https://www.freecodecamp.org/" target="_blank">
            Portfolio
        </a>

        <hr>

        <div class="social-media">

            <h2>Connect with me</h2>

            <a href="https://twitter.com/" target="_blank">Twitter</a>
            <a href="https://www.linkedin.com/" target="_blank">LinkedIn</a>
            <a href="https://github.com/" target="_blank">GitHub</a>

        </div>

    </div>

</body>

</html>
